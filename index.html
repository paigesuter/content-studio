<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Studio">
  <meta name="theme-color" content="#FFFBF8">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Paige's Content Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <aside class="side" id="side">
    <div class="brandmark"><span class="script">Paige</span><span class="caps">content studio</span></div>
    <nav id="nav"></nav>
  </aside>
  <div class="mainwrap">
    <header class="mob-top">
      <div class="brandmark"><span class="script">Paige</span><span class="caps">content studio</span></div>
    </header>
    <nav class="mob-nav" id="mobNav"></nav>
    <main id="view" class="view"></main>
  </div>
  <div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
  <div id="toast" class="toast"></div>
  <input type="file" id="uploadInput" accept="image/*,video/*" multiple hidden>
  <input type="file" id="fontInput" accept=".ttf,.otf,font/ttf,font/otf" hidden>
  <script type="module" src="studio.js"></script>
</body>
</html>
